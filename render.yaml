services:
  - type: web
    name: smart-crop-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: TTS_ENABLED
        value: "true"
      - key: TTS_ON_DIAGNOSIS
        value: "true"
      - key: DATABASE_PATH
        value: /tmp/smart_crop_bot.db
      - key: MEDIA_DIR
        value: /tmp/scb_media
      # Set these in the Render dashboard (do not commit secrets):
      # TELEGRAM_BOT_TOKEN
      # APP_PUBLIC_URL (https://your-service.onrender.com)
      # GEMINI_API_KEY, GROQ_API_KEY, OPENWEATHER_API_KEY

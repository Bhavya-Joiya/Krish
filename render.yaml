services:
  - type: web
    name: smart-crop-bot
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: TTS_ENABLED
        value: "true"
      - key: TTS_ON_DIAGNOSIS
        value: "true"
      - key: DATABASE_PATH
        value: /app/data/smart_crop_bot.db
      - key: MEDIA_DIR
        value: /tmp/scb_media
      - key: PROACTIVE_ENABLED
        value: "true"
      # Set these in the Render dashboard (do not commit secrets):
      # TELEGRAM_BOT_TOKEN
      # TELEGRAM_BOT_USERNAME
      # APP_PUBLIC_URL (https://your-service.onrender.com)
      # GEMINI_API_KEY, GROQ_API_KEY, OPENWEATHER_API_KEY
      # DATA_GOV_IN_API_KEY
      # DATA_GOV_IN_RESOURCE_ID (default 9ef84268-d588-465a-a308-a864a43d0070)
